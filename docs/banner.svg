<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Slidespoken</title>
  <desc id="desc">The name Slidespoken with the tagline "Speak. Your slides build themselves." and a sound wave that turns into slide cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d18"/>
      <stop offset="0.6" stop-color="#11132a"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2140"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="930" cy="160" r="260" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="160" font-size="76" font-weight="700" fill="#eef0ff" letter-spacing="-1.5">Slidespoken</text>
    <text x="74" y="212" font-size="28" fill="#a5abc9">Speak. Your slides build themselves.</text>
    <rect x="74" y="236" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <!-- Sound wave -->
  <g fill="url(#accent)" transform="translate(36 0)">
    <rect x="600" y="148" width="8" height="24" rx="4"/>
    <rect x="616" y="132" width="8" height="56" rx="4"/>
    <rect x="632" y="112" width="8" height="96" rx="4"/>
    <rect x="648" y="128" width="8" height="64" rx="4"/>
    <rect x="664" y="100" width="8" height="120" rx="4"/>
    <rect x="680" y="122" width="8" height="76" rx="4"/>
    <rect x="696" y="138" width="8" height="44" rx="4"/>
    <rect x="712" y="126" width="8" height="68" rx="4"/>
    <rect x="728" y="144" width="8" height="32" rx="4"/>
    <rect x="744" y="152" width="8" height="16" rx="4"/>
  </g>

  <!-- Flow into cards -->
  <path d="M798 160 C 820 160, 822 120, 846 112" fill="none" stroke="#818cf8" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M798 160 C 830 160, 846 205, 880 212" fill="none" stroke="#e879f9" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Slide cards (16:9) -->
  <g>
    <rect x="1000" y="150" width="200" height="112" rx="12" fill="url(#card)" stroke="#e879f9" stroke-opacity="0.35"/>
    <rect x="1018" y="170" width="90" height="10" rx="5" fill="#e879f9" fill-opacity="0.7"/>
    <rect x="1018" y="196" width="150" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.5"/>
    <rect x="1018" y="214" width="120" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.5"/>
    <rect x="1018" y="232" width="135" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.5"/>
  </g>
  <g>
    <rect x="880" y="160" width="200" height="112" rx="12" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="898" y="180" width="110" height="10" rx="5" fill="#a78bfa" fill-opacity="0.8"/>
    <circle cx="912" cy="216" r="9" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="928" y="212" width="40" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.5"/>
    <circle cx="992" cy="216" r="9" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="1008" y="212" width="40" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.5"/>
    <rect x="898" y="242" width="150" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.4"/>
  </g>
  <g>
    <rect x="846" y="58" width="220" height="124" rx="14" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.6"/>
    <rect x="866" y="80" width="64" height="64" rx="12" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4"/>
    <circle cx="898" cy="112" r="14" fill="none" stroke="#c7d2fe" stroke-width="3"/>
    <rect x="944" y="88" width="100" height="12" rx="6" fill="#eef0ff" fill-opacity="0.9"/>
    <rect x="944" y="110" width="80" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.6"/>
    <rect x="944" y="126" width="92" height="7" rx="3.5" fill="#a5abc9" fill-opacity="0.6"/>
    <rect x="866" y="158" width="60" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
